global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'fastapi'
    static_configs:
      - targets: ['api:8000']
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'cognitive_monitor'
    static_configs:
      - targets: ['api:9091']
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
