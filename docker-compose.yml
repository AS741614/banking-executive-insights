# ESOTERIC BANK Unified Enterprise Runtime

services:
  # [DATABASE]
  # Institutional persistence with optimized pooling and fail-safe healthchecks.
  db:
    image: postgres:16-alpine
    container_name: esoteric_db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-esoteric_admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-governance_secret_2026}
      - POSTGRES_DB=${DB_NAME:-esoteric_bank}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    # Internal port only, exposure managed through bridge
    expose:
      - "5432"
    ports:
      - "5433:5432"
    networks:
      - esoteric_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # [BACKEND API]
  # Production-grade async runner with uvicorn workers and OTLP telemetry.
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.enterprise
      target: api
    container_name: esoteric_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-esoteric_admin}:${DB_PASSWORD:-governance_secret_2026}@db:5432/${DB_NAME:-esoteric_bank}
      - DWH_URL=postgresql://${DB_USER:-esoteric_admin}:${DB_PASSWORD:-governance_secret_2026}@db:5432/${DB_NAME:-esoteric_bank}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - PROMETHEUS_METRICS_ENABLED=True
      - ENVIRONMENT=production
      - GUNICORN_WORKERS=1
      - GUNICORN_THREADS=1
    ports:
      - "8000:8000"
    networks:
      - esoteric_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/platform/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # [FRONTEND EXPERIENCE LAYER]
  # Next.js App Router in standalone mode for optimized enterprise delivery.
  experience-layer:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: esoteric_experience_layer
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    networks:
      - esoteric_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  # [OBSERVABILITY - PROMETHEUS]
  prometheus:
    image: prom/prometheus:latest
    container_name: esoteric_prometheus
    restart: always
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - esoteric_net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # [OBSERVABILITY - GRAFANA]
  # Provisioned with Prometheus datasource and Executive Oversight dashboards.
  grafana:
    image: grafana/grafana:latest
    container_name: esoteric_grafana
    restart: always
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-esoteric_admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3002:3000"
    networks:
      - esoteric_net

  # [OBSERVABILITY - OTEL COLLECTOR]
  # Central telemetry sink for traces and metrics routing.
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: esoteric_otel_collector
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./docker/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics
    networks:
      - esoteric_net

networks:
  esoteric_net:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
