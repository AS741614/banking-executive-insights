name: ci

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  pipeline:

    runs-on: ubuntu-latest

    services:

      postgres:

        image: postgres:16

        env:
          POSTGRES_DB: bank_dwh
          POSTGRES_USER: dwh
          POSTGRES_PASSWORD: dwh

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DWH_URL: postgresql+psycopg2://dwh:dwh@localhost:5432/bank_dwh

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate source data
        run: python src/generate_source_data.py

      - name: Run ETL pipeline
        run: python src/etl.py

      - name: Run data quality checks
        run: python src/run_quality_checks.py

      - name: Run ESOTERIC Convergence Validation
        run: python -m testing.final_cascade.final_cascade_runner

      - name: Runtime Compilation Validation
        run: python -m compileall .

      - name: Pipeline Complete
        run: echo "ESOTERIC ENTERPRISE PIPELINE PASSED"
