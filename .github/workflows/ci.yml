name: ci

on:
  push:
  pull_request:

jobs:

  pipeline:

    runs-on: ubuntu-latest

    services:

      postgres:

        image: postgres:16

        env:
          POSTGRES_DB: bank_dwh
          POSTGRES_USER: dwh
          POSTGRES_PASSWORD: dwh

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DWH_URL: postgresql+psycopg2://dwh:dwh@localhost:5432/bank_dwh

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate source data
        run: python src/generate_source_data.py

      - name: Run ETL pipeline
        run: python src/etl.py

      - name: Run data quality checks
        run: python src/run_quality_checks.py
