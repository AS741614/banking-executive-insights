name: ESOTERIC Enterprise Pipeline

on:
  push:
    branches:
      - main
      - release/**

  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  enterprise-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Runtime Validation
        run: |
          python -m compileall .

      - name: ESOTERIC Convergence Validation
        run: |
          python -m testing.final_cascade.final_cascade_runner

      - name: API Namespace Validation
        run: |
          python -c "
import requests
r = requests.get('http://localhost:8000/api/v1/platform/health')
print(r.status_code)
"

      - name: Pipeline Complete
        run: echo 'ESOTERIC ENTERPRISE PIPELINE PASSED'
